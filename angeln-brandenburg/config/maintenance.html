<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Angeln Brandenburg – Bald verfügbar</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --deep-water-blue: #1a3a5c;
      --reed-green: #3d6b4f;
      --light-blue: #5b9bd5;
      --bg: #0d2137;
      --text: #e8f4f8;
    }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, var(--bg) 0%, var(--deep-water-blue) 60%, var(--reed-green) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--text);
      padding: 1.5rem;
    }
    .card {
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 1.5rem;
      padding: 3rem 2.5rem;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .icon { font-size: 4rem; margin-bottom: 1rem; }
    h1 { font-size: 2rem; font-weight: 700; margin-bottom: 0.75rem; color: #fff; }
    p { font-size: 1.05rem; line-height: 1.65; opacity: 0.85; margin-bottom: 1.5rem; }
    .badge {
      display: inline-block;
      background: var(--reed-green);
      color: #fff;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.35rem 1rem;
      border-radius: 999px;
    }
    .fish-row {
      margin-top: 2rem;
      font-size: 1.8rem;
      letter-spacing: 0.3em;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🎣</div>
    <h1>Angeln Brandenburg 2026</h1>
    <p>Wir bauen gerade die beste Angelportal-Seite für Brandenburg auf. Aktuelle Gewässerinfos, Beißindex und mehr – bald live!</p>
    <span class="badge">In Kürze verfügbar</span>
    <div class="fish-row">🐟 🐠 🐡</div>
  </div>
</body>
</html>
