name: Preview Deploy

on:
  push:
    branches:
      - 'claude/**'
    paths:
      - 'angeln-brandenburg/**'
      - '.github/workflows/preview.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  preview:
    name: 🔍 Deploy to Preview
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── 1. Code auschecken ──────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. .htpasswd generieren ──────────────────────────────────
      - name: Generate .htpasswd
        run: |
          sudo apt-get install -y apache2-utils -q
          htpasswd -nb "${{ secrets.PREVIEW_USER }}" "${{ secrets.PREVIEW_PASS }}" > /tmp/.htpasswd

      # ── 3. Staging-Verzeichnis zusammenstellen ───────────────────
      - name: Prepare staging directory
        run: |
          mkdir -p /tmp/preview-staging

          # Auth-Dateien
          cp /tmp/.htpasswd /tmp/preview-staging/.htpasswd

          echo 'AuthType Basic' > /tmp/preview-staging/.htaccess
          echo 'AuthName "Preview - Nur fuer Berechtigte"' >> /tmp/preview-staging/.htaccess
          echo "AuthUserFile /home/${{ secrets.FTP_USER }}/public_html/preview/.htpasswd" >> /tmp/preview-staging/.htaccess
          echo 'Require valid-user' >> /tmp/preview-staging/.htaccess

          # Preview-Seite
          cp angeln-brandenburg/config/maintenance.html /tmp/preview-staging/index.html

      # ── 4. Alle Dateien per FTP-Deploy-Action hochladen ──────────
      - name: Deploy to preview subdirectory
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:   ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          port:     ${{ secrets.FTP_PORT }}
          protocol: ftps
          local-dir:  /tmp/preview-staging/
          server-dir: public_html/preview/
          exclude: |
            **/.git*
            **/.git*/**

      # ── 5. Summary ───────────────────────────────────────────────
      - name: Preview summary
        run: |
          echo ""
          echo "======================================"
          echo "Preview verfuegbar unter:"
          echo "  https://preview.angeln-brandenburg.de"
          echo "  Benutzer: ${{ secrets.PREVIEW_USER }}"
          echo "======================================"
          echo "Zeit: $(date '+%d.%m.%Y %H:%M:%S')"
          echo "======================================"
