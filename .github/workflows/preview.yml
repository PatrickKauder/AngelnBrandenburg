name: Preview Deploy

on:
  push:
    branches:
      - 'claude/**'
    paths:
      - 'angeln-brandenburg/**'
      - '.github/workflows/preview.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  preview:
    name: 🔍 Deploy to Preview
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── 1. Code auschecken ──────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. .htpasswd generieren ──────────────────────────────────
      - name: Generate .htpasswd
        run: |
          sudo apt-get install -y apache2-utils -q
          htpasswd -nb "${{ secrets.PREVIEW_USER }}" "${{ secrets.PREVIEW_PASS }}" > /tmp/.htpasswd

      # ── 3. Staging-Verzeichnis zusammenstellen ───────────────────
      - name: Prepare staging directory
        run: |
          mkdir -p $GITHUB_WORKSPACE/preview-staging

          # Auth-Dateien
          cp /tmp/.htpasswd $GITHUB_WORKSPACE/preview-staging/.htpasswd

          echo 'AuthType Basic' > $GITHUB_WORKSPACE/preview-staging/.htaccess
          echo 'AuthName "Preview - Nur fuer Berechtigte"' >> $GITHUB_WORKSPACE/preview-staging/.htaccess
          echo "AuthUserFile /home/${{ secrets.FTP_USER }}/public_html/preview/.htpasswd" >> $GITHUB_WORKSPACE/preview-staging/.htaccess
          echo 'Require valid-user' >> $GITHUB_WORKSPACE/preview-staging/.htaccess

          # Preview-Seite
          cp angeln-brandenburg/config/maintenance.html $GITHUB_WORKSPACE/preview-staging/index.html

      # ── 4. Dateien per curl/FTP hochladen ────────────────────────
      - name: Deploy to preview subdirectory
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          BASE="ftps://${FTP_HOST}:${FTP_PORT}/public_html/preview"
          OPTS="-u ${FTP_USER}:${FTP_PASS} --ssl-reqd --ftp-create-dirs -v"

          echo "=== Uploading files to ${BASE} ==="
          for f in index.html .htaccess .htpasswd; do
            echo "--- Uploading $f ---"
            curl $OPTS -T "$GITHUB_WORKSPACE/preview-staging/$f" "${BASE}/$f"
          done

      # ── 5. Summary ───────────────────────────────────────────────
      - name: Preview summary
        run: |
          echo ""
          echo "======================================"
          echo "Preview verfuegbar unter:"
          echo "  https://preview.angeln-brandenburg.de"
          echo "  Benutzer: ${{ secrets.PREVIEW_USER }}"
          echo "======================================"
          echo "Zeit: $(date '+%d.%m.%Y %H:%M:%S')"
          echo "======================================"
