name: Preview Deploy

on:
  push:
    branches:
      - 'claude/**'
    paths:
      - 'angeln-brandenburg/**'
      - '.github/workflows/preview.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  preview:
    name: 🔍 Deploy to Preview
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── 1. Code auschecken ──────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. .htpasswd generieren ──────────────────────────────────
      - name: Generate .htpasswd
        run: |
          sudo apt-get install -y apache2-utils -q
          htpasswd -nb "${{ secrets.PREVIEW_USER }}" "${{ secrets.PREVIEW_PASS }}" > /tmp/.htpasswd

      # ── 3. .htaccess für Preview-Verzeichnis erstellen ───────────
      - name: Create preview .htaccess
        run: |
          echo 'AuthType Basic' > /tmp/preview.htaccess
          echo 'AuthName "Preview – Nur für Berechtigte"' >> /tmp/preview.htaccess
          echo "AuthUserFile /home/${{ secrets.FTP_USER }}/public_html/preview/.htpasswd" >> /tmp/preview.htaccess
          echo 'Require valid-user' >> /tmp/preview.htaccess

      # ── 4. Auth-Dateien hochladen ────────────────────────────────
      - name: Upload auth files
        run: |
          BASE="ftp://${{ secrets.FTP_HOST }}/public_html/preview"
          USER="${{ secrets.FTP_USER }}:${{ secrets.FTP_PASS }}"
          OPTS="--ftp-ssl-reqd -k --ftp-pasv -s -S"

          curl $OPTS -u "$USER" -T /tmp/.htpasswd        "$BASE/.htpasswd"
          curl $OPTS -u "$USER" -T /tmp/preview.htaccess "$BASE/.htaccess"

      # ── 5. Preview-Dateien hochladen ─────────────────────────────
      - name: Upload preview files
        run: |
          BASE="ftp://${{ secrets.FTP_HOST }}/public_html/preview"
          USER="${{ secrets.FTP_USER }}:${{ secrets.FTP_PASS }}"
          OPTS="--ftp-ssl-reqd -k --ftp-pasv -s -S"

          curl $OPTS -u "$USER" -T angeln-brandenburg/config/maintenance.html "$BASE/maintenance.html"

      # ── 6. Summary ───────────────────────────────────────────────
      - name: Preview summary
        run: |
          echo ""
          echo "======================================"
          echo "🔍 Preview verfügbar unter:"
          echo "   https://preview.angeln-brandenburg.de"
          echo "   Benutzer: ${{ secrets.PREVIEW_USER }}"
          echo "======================================"
          echo "Zeit: $(date '+%d.%m.%Y %H:%M:%S')"
          echo "======================================"
