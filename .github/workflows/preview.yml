name: Preview Deploy

on:
  push:
    branches:
      - 'claude/**'
    paths:
      - 'angeln-brandenburg/**'
      - '.github/workflows/preview.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  preview:
    name: 🔍 Deploy to Preview
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── 1. Code auschecken ──────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. .htpasswd generieren ──────────────────────────────────
      - name: Generate .htpasswd
        run: |
          sudo apt-get install -y apache2-utils -q
          htpasswd -nb "${{ secrets.PREVIEW_USER }}" "${{ secrets.PREVIEW_PASS }}" > /tmp/.htpasswd

      # ── 3. Staging-Verzeichnis zusammenstellen ───────────────────
      - name: Prepare staging directory
        run: |
          mkdir -p $GITHUB_WORKSPACE/preview-staging

          # Auth-Dateien
          cp /tmp/.htpasswd $GITHUB_WORKSPACE/preview-staging/.htpasswd

          echo 'AuthType Basic' > $GITHUB_WORKSPACE/preview-staging/.htaccess
          echo 'AuthName "Preview - Nur fuer Berechtigte"' >> $GITHUB_WORKSPACE/preview-staging/.htaccess
          echo "AuthUserFile /home/${{ secrets.SERVER_HOME_USER }}/domains/brandenburg-angler.de/public_html/preview/.htpasswd" >> $GITHUB_WORKSPACE/preview-staging/.htaccess
          echo 'Require valid-user' >> $GITHUB_WORKSPACE/preview-staging/.htaccess

          # Preview-Seite
          cp angeln-brandenburg/config/maintenance.html $GITHUB_WORKSPACE/preview-staging/index.html

      # ── 4. Alle Dateien per curl hochladen (absoluter FTP-Pfad) ──
      - name: Deploy to preview subdirectory
        run: |
          HOST="${{ secrets.FTP_HOST }}"
          USER="${{ secrets.FTP_USER }}:${{ secrets.FTP_PASS }}"
          PORT="${{ secrets.FTP_PORT }}"
          DEST="ftp://${HOST}:%2Fhome%2F${{ secrets.SERVER_HOME_USER }}%2Fdomains%2Fbrandenburg-angler.de%2Fpublic_html%2Fpreview%2F"
          OPTS="--ftp-ssl-reqd --ftp-pasv --ftp-create-dirs -s -S --port ${PORT}"

          echo "📡 FTP Root prüfen..."
          curl --ftp-ssl-reqd --ftp-pasv -u "$USER" --port "${PORT}" \
            "ftp://${HOST}/" --list-only || true

          echo "📤 Lade Dateien hoch..."
          for f in $GITHUB_WORKSPACE/preview-staging/*; do
            filename=$(basename "$f")
            echo "  → $filename"
            curl $OPTS -u "$USER" -T "$f" "${DEST}${filename}"
          done

          # Versteckte Dateien separat
          for f in $GITHUB_WORKSPACE/preview-staging/.*; do
            filename=$(basename "$f")
            [ "$filename" = "." ] || [ "$filename" = ".." ] && continue
            echo "  → $filename (hidden)"
            curl $OPTS -u "$USER" -T "$f" "${DEST}${filename}"
          done

          echo "✅ Upload abgeschlossen"

      # ── 5. Summary ───────────────────────────────────────────────
      - name: Preview summary
        run: |
          echo ""
          echo "======================================"
          echo "Preview verfuegbar unter:"
          echo "  https://brandenburg-angler.de/preview/"
          echo "  Benutzer: ${{ secrets.PREVIEW_USER }}"
          echo "======================================"
          echo "Zeit: $(date '+%d.%m.%Y %H:%M:%S')"
          echo "======================================"
