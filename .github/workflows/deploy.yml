name: Go-Live Deploy

on:
  # Nur manuell auslösbar – nach Freigabe durch Patrick
  workflow_dispatch:
    inputs:
      reason:
        description: 'Grund für Go-Live Deploy'
        required: false
        default: 'Nach Staging-Freigabe'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: 🚀 Go-Live Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Code auschecken ──────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Deploy-Info ausgeben ──────────────────────────────────
      - name: Show deploy info
        run: |
          echo "🚀 Go-Live Deploy gestartet"
          echo "Grund:  ${{ github.event.inputs.reason }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"

      # ── 3. Alle Dateien deployen (Go-Live .htaccess + robots.txt) ─
      - name: Deploy to server (Maintenance Mode AUS)
        run: |
          HOST="${{ secrets.FTP_HOST }}"
          PORT="${{ secrets.FTP_PORT }}"
          USER="${{ secrets.FTP_USER }}:${{ secrets.FTP_PASS }}"
          BASE="ftp://${HOST}:${PORT}"
          ROOT="%2Fhome%2F${{ secrets.SERVER_HOME_USER }}%2Fpublic_html"
          OPTS="--ftp-ssl-reqd --ftp-pasv --insecure --ftp-create-dirs -s -S"

          upload() {
            local file="$1"
            local dest="$2"
            echo "  → $dest"
            curl $OPTS -u "$USER" -T "$file" "${BASE}/${ROOT}/${dest}"
          }

          upload_dir() {
            local src_dir="$1"
            local dest_dir="$2"
            find "$src_dir" -type f | sort | while read -r f; do
              rel="${f#${src_dir}/}"
              upload "$f" "${dest_dir}/${rel}"
            done
          }

          echo "📤 Config-Dateien (Go-Live: Maintenance OFF, robots.txt freigegeben)..."
          upload angeln-brandenburg/config/maintenance.html "maintenance.html"
          upload angeln-brandenburg/config/.htaccess.golive ".htaccess"
          upload angeln-brandenburg/config/robots.txt.golive "robots.txt"

          echo "📤 Plugin: angeln-bb-core..."
          upload_dir angeln-brandenburg/plugins/angeln-bb-core "wp-content/plugins/angeln-bb-core"

          echo "📤 Plugin: angeln-bb-beissindex..."
          upload_dir angeln-brandenburg/plugins/angeln-bb-beissindex "wp-content/plugins/angeln-bb-beissindex"

          echo "📤 Plugin: angeln-bb-pegel..."
          upload_dir angeln-brandenburg/plugins/angeln-bb-pegel "wp-content/plugins/angeln-bb-pegel"

          echo "📤 Plugin: angeln-bb-ai-content..."
          upload_dir angeln-brandenburg/plugins/angeln-bb-ai-content "wp-content/plugins/angeln-bb-ai-content"

          echo "📤 Theme: angeln-bb..."
          upload_dir angeln-brandenburg/themes/angeln-bb "wp-content/themes/angeln-bb"

          echo "✅ Go-Live Deploy abgeschlossen"

      # ── 4. Go-Live Summary ───────────────────────────────────────
      - name: Go-Live summary
        run: |
          echo ""
          echo "======================================"
          echo "🚀 GO-LIVE ABGESCHLOSSEN!"
          echo ""
          echo "  https://brandenburg-angler.de/"
          echo "  (Seite ist jetzt öffentlich erreichbar)"
          echo "======================================"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Zeit:   $(date '+%d.%m.%Y %H:%M:%S')"
          echo "======================================"
