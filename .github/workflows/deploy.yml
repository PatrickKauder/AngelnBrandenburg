name: Go-Live Deploy

on:
  # Nur manuell auslösbar – nach Freigabe durch Patrick
  workflow_dispatch:
    inputs:
      reason:
        description: 'Grund für Go-Live Deploy'
        required: false
        default: 'Nach Staging-Freigabe'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: 🚀 Go-Live Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Code auschecken ──────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Deploy-Info ausgeben ──────────────────────────────────
      - name: Show deploy info
        run: |
          echo "🚀 Go-Live Deploy gestartet"
          echo "Grund:  ${{ github.event.inputs.reason }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"

      # ── 3. SSH-Key einrichten ────────────────────────────────────
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      # ── 4. Alle Dateien deployen (Go-Live .htaccess + robots.txt) ─
      - name: Deploy to server (Maintenance Mode AUS)
        run: |
          echo "📤 Config-Dateien (Go-Live: Maintenance OFF, robots.txt freigegeben)..."
          rsync -az -e "ssh -p ${{ secrets.SSH_PORT }}" \
            angeln-brandenburg/config/maintenance.html \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/${{ secrets.SSH_USER }}/domains/brandenburg-angler.de/public_html/maintenance.html
          rsync -az -e "ssh -p ${{ secrets.SSH_PORT }}" \
            angeln-brandenburg/config/.htaccess.golive \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/${{ secrets.SSH_USER }}/domains/brandenburg-angler.de/public_html/.htaccess
          rsync -az -e "ssh -p ${{ secrets.SSH_PORT }}" \
            angeln-brandenburg/config/robots.txt.golive \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/${{ secrets.SSH_USER }}/domains/brandenburg-angler.de/public_html/robots.txt

          echo "📤 Plugins..."
          rsync -az --delete -e "ssh -p ${{ secrets.SSH_PORT }}" \
            angeln-brandenburg/plugins/angeln-bb-core/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/${{ secrets.SSH_USER }}/domains/brandenburg-angler.de/public_html/wp-content/plugins/angeln-bb-core/
          rsync -az --delete -e "ssh -p ${{ secrets.SSH_PORT }}" \
            angeln-brandenburg/plugins/angeln-bb-beissindex/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/${{ secrets.SSH_USER }}/domains/brandenburg-angler.de/public_html/wp-content/plugins/angeln-bb-beissindex/
          rsync -az --delete -e "ssh -p ${{ secrets.SSH_PORT }}" \
            angeln-brandenburg/plugins/angeln-bb-pegel/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/${{ secrets.SSH_USER }}/domains/brandenburg-angler.de/public_html/wp-content/plugins/angeln-bb-pegel/
          rsync -az --delete -e "ssh -p ${{ secrets.SSH_PORT }}" \
            angeln-brandenburg/plugins/angeln-bb-ai-content/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/${{ secrets.SSH_USER }}/domains/brandenburg-angler.de/public_html/wp-content/plugins/angeln-bb-ai-content/

          echo "📤 Theme..."
          rsync -az --delete -e "ssh -p ${{ secrets.SSH_PORT }}" \
            angeln-brandenburg/themes/angeln-bb/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/${{ secrets.SSH_USER }}/domains/brandenburg-angler.de/public_html/wp-content/themes/angeln-bb/

          echo "✅ Go-Live Deploy abgeschlossen"

      # ── 4. Go-Live Summary ───────────────────────────────────────
      - name: Go-Live summary
        run: |
          echo ""
          echo "======================================"
          echo "🚀 GO-LIVE ABGESCHLOSSEN!"
          echo ""
          echo "  https://brandenburg-angler.de/"
          echo "  (Seite ist jetzt öffentlich erreichbar)"
          echo "======================================"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Zeit:   $(date '+%d.%m.%Y %H:%M:%S')"
          echo "======================================"
